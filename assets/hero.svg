<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-labelledby="t d">
<title id="t">Vitalii Zabolotnyi — DB by day. Vibes by night.</title>
<desc id="d">An animated card that cycles between day and night. By day: a tidy database schema under the sun and the line "DB by day." By night: a code editor types out a ship() function under the moon and the line reads "Vibes by night."</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
/* one 14 s loop: day 0-38%, dusk 38-48%, night 48-88%, dawn 88-100% */
.sky{animation:sky 14s infinite}
.edge{animation:edge 14s infinite}
.day{animation:dayop 14s infinite}
.night{opacity:0;animation:nightop 14s infinite}
.wheel{transform-origin:656px 322px;animation:wheel 14s infinite ease-in-out}
.name{animation:ink 14s infinite}
.chip{animation:chip 14s infinite}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.cv{transform-box:fill-box;transform-origin:right center;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:steps(22,end)}
.cv1{animation-name:cv1}.cv2{animation-name:cv2}.cv3{animation-name:cv3}.cv4{animation-name:cv4}.cv5{animation-name:cv5}.cv6{animation-name:cv6}
.done{animation:done 14s infinite}
.cur{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.star{animation:tw 2.8s ease-in-out infinite}
@keyframes sky{0%,38%{fill:#f6f8fa}42%{fill:#f4b183}45%{fill:#3d2a5c}48%,88%{fill:#0d1117}92%{fill:#3d2a5c}96%{fill:#f6c9a3}100%{fill:#f6f8fa}}
@keyframes edge{0%,38%{stroke:#d0d7de}48%,88%{stroke:#30363d}100%{stroke:#d0d7de}}
@keyframes dayop{0%,38%{opacity:1}43%,94%{opacity:0}100%{opacity:1}}
@keyframes nightop{0%,43%{opacity:0}48%,88%{opacity:1}94%,100%{opacity:0}}
@keyframes wheel{0%,34%{transform:rotate(0deg)}50%,84%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes ink{0%,38%{fill:#0f172a}48%,88%{fill:#f0f6fc}100%{fill:#0f172a}}
@keyframes chip{0%,38%{fill:#ffffff;stroke:#d0d7de}48%,88%{fill:#010409;stroke:#30363d}100%{fill:#ffffff;stroke:#d0d7de}}
@keyframes cv1{0%,49%{transform:scaleX(1)}53%,100%{transform:scaleX(0)}}
@keyframes cv2{0%,53%{transform:scaleX(1)}59%,100%{transform:scaleX(0)}}
@keyframes cv3{0%,59%{transform:scaleX(1)}64%,100%{transform:scaleX(0)}}
@keyframes cv4{0%,64%{transform:scaleX(1)}69%,100%{transform:scaleX(0)}}
@keyframes cv5{0%,69%{transform:scaleX(1)}74%,100%{transform:scaleX(0)}}
@keyframes cv6{0%,74%{transform:scaleX(1)}75%,100%{transform:scaleX(0)}}
@keyframes done{0%,75%{opacity:0}76%,88%{opacity:1}94%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@keyframes tw{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="card"><rect width="860" height="280" rx="14"/></clipPath>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8b949e" stroke-opacity=".13"/></pattern>
  <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  <mask id="crescent"><rect x="620" y="546" width="72" height="72" fill="#fff"/><circle cx="666" cy="575" r="16"/></mask>
</defs>

<g clip-path="url(#card)">
  <rect class="sky" width="860" height="280" fill="#f6f8fa"/>
  <rect width="860" height="280" fill="url(#grid)"/>

  <!-- stars, night only -->
  <g class="night" fill="#e6edf3">
    <circle class="star" cx="250" cy="30" r="1.1"/>
    <circle class="star" cx="330" cy="38" r="1.5" style="animation-duration:3.7s"/>
    <circle class="star" cx="392" cy="62" r="1"/>
    <circle class="star" cx="446" cy="34" r="1.3" style="animation-duration:2.1s"/>
    <circle class="star" cx="498" cy="46" r="1.6" style="animation-duration:3.3s"/>
    <circle class="star" cx="548" cy="82" r="1"/>
    <circle class="star" cx="590" cy="30" r="1.2" style="animation-duration:4.1s"/>
    <circle class="star" cx="722" cy="28" r="1.4" style="animation-duration:2.4s"/>
    <circle class="star" cx="760" cy="74" r="1"/>
    <circle class="star" cx="806" cy="36" r="1.6" style="animation-duration:3.1s"/>
    <circle class="star" cx="834" cy="90" r="1.1"/>
    <circle class="star" cx="592" cy="262" r="1.2" style="animation-duration:3.9s"/>
    <circle class="star" cx="726" cy="236" r="1"/>
    <circle class="star" cx="812" cy="250" r="1.4" style="animation-duration:2.6s"/>
  </g>

  <!-- the sun and the moon sit on opposite sides of one wheel -->
  <g class="wheel">
    <circle cx="656" cy="62" r="30" fill="#fbbf24" opacity=".35" filter="url(#halo)"/>
    <g class="rays" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <path d="M656 28v8M656 88v8M622 62h8M682 62h8M631.960 37.960l5.660 5.660M674.380 80.380l5.660 5.660M631.960 86.040l5.660-5.660M674.380 43.620l5.660-5.660"/>
    </g>
    <circle cx="656" cy="62" r="17" fill="#fbbf24"/>
    <g transform="rotate(180 656 582)">
      <circle cx="656" cy="582" r="26" fill="#c9d1d9" opacity=".3" filter="url(#halo)"/>
      <circle cx="656" cy="582" r="19" fill="#f0f6fc" mask="url(#crescent)"/>
    </g>
  </g>

  <!-- day: a tidy schema -->
  <g class="day">
    <g fill="none" stroke="#8c98a8" stroke-width="1.5">
      <path d="M580 149H592V204H604M710 187H722V166H734"/>
      <path d="M598 199l6 5-6 5M728 161l6 5-6 5" stroke-linejoin="round"/>
    </g>
    <circle cx="580" cy="149" r="3" fill="#2563eb"/>
    <circle cx="710" cy="187" r="3" fill="#2563eb"/>
    <g class="mono" font-size="11">
      <rect x="474" y="112" width="106" height="86" rx="7" fill="#fff" stroke="#c3ccd7" stroke-width="1.2"/>
      <path d="M475 119a6 6 0 0 1 6-6h92a6 6 0 0 1 6 6v17H475z" fill="#e6ecf3"/>
      <text x="486" y="129" font-weight="700" fill="#0f172a">users</text>
      <text x="486" y="153" fill="#52607a">id</text><text x="568" y="153" text-anchor="end" font-weight="700" fill="#2563eb">PK</text>
      <text x="486" y="170" fill="#52607a">email</text>
      <text x="486" y="187" fill="#52607a">created_at</text>

      <rect x="604" y="150" width="106" height="103" rx="7" fill="#fff" stroke="#c3ccd7" stroke-width="1.2"/>
      <path d="M605 157a6 6 0 0 1 6-6h92a6 6 0 0 1 6 6v17H605z" fill="#e6ecf3"/>
      <text x="616" y="167" font-weight="700" fill="#0f172a">orders</text>
      <text x="616" y="191" fill="#52607a">id</text><text x="698" y="191" text-anchor="end" font-weight="700" fill="#2563eb">PK</text>
      <text x="616" y="208" fill="#52607a">user_id</text><text x="698" y="208" text-anchor="end" font-weight="700" fill="#2563eb">FK</text>
      <text x="616" y="225" fill="#52607a">total</text>
      <text x="616" y="242" fill="#52607a">status</text>

      <rect x="734" y="112" width="106" height="86" rx="7" fill="#fff" stroke="#c3ccd7" stroke-width="1.2"/>
      <path d="M735 119a6 6 0 0 1 6-6h92a6 6 0 0 1 6 6v17H735z" fill="#e6ecf3"/>
      <text x="746" y="129" font-weight="700" fill="#0f172a">payments</text>
      <text x="746" y="153" fill="#52607a">id</text><text x="828" y="153" text-anchor="end" font-weight="700" fill="#2563eb">PK</text>
      <text x="746" y="170" fill="#52607a">order_id</text><text x="828" y="170" text-anchor="end" font-weight="700" fill="#2563eb">FK</text>
      <text x="746" y="187" fill="#52607a">amount</text>
    </g>
  </g>

  <!-- night: an editor where the code types itself -->
  <g class="night mono" font-size="11.500" opacity="0">
    <rect x="474" y="104" width="366" height="154" rx="9" fill="none" stroke="#39d353" stroke-width="3" filter="url(#glow)"/>
    <rect x="474" y="104" width="366" height="154" rx="9" fill="#0b0f14" stroke="#39d353" stroke-width="1.2"/>
    <path d="M475 113a8 8 0 0 1 8-8h348a8 8 0 0 1 8 8v17H475z" fill="#151b23"/>
    <circle cx="489" cy="117.500" r="4" fill="#ff5f57"/><circle cx="502" cy="117.500" r="4" fill="#febc2e"/><circle cx="515" cy="117.500" r="4" fill="#28c840"/>
    <text x="532" y="121.500" fill="#c9d1d9" font-size="11">ship.ts</text>
    <text x="828" y="121.500" text-anchor="end" font-size="11" font-weight="700"><tspan fill="#3fb950">+128</tspan><tspan fill="#f85149" dx="6">−3</tspan></text>
    <text x="498" y="148" text-anchor="end" fill="#484f58">1</text>
    <text x="510" y="148" fill="#e6edf3" xml:space="preserve" style="white-space:pre"><tspan fill="#8b949e">// ship first, polish later</tspan></text>
    <rect class="cv cv1" x="506" y="135" width="328" height="17" fill="#0b0f14"/>
    <text x="498" y="166" text-anchor="end" fill="#484f58">2</text>
    <text x="510" y="166" fill="#e6edf3" xml:space="preserve" style="white-space:pre"><tspan fill="#ff7b72">export</tspan> <tspan fill="#ff7b72">async</tspan> <tspan fill="#ff7b72">function</tspan> <tspan fill="#d2a8ff">ship</tspan>(idea: <tspan fill="#79c0ff">Idea</tspan>) {</text>
    <rect class="cv cv2" x="506" y="153" width="328" height="17" fill="#0b0f14"/>
    <text x="498" y="184" text-anchor="end" fill="#484f58">3</text>
    <text x="510" y="184" fill="#e6edf3" xml:space="preserve" style="white-space:pre">  <tspan fill="#ff7b72">const</tspan> app = <tspan fill="#ff7b72">await</tspan> <tspan fill="#d2a8ff">vibe</tspan>(idea);</text>
    <rect class="cv cv3" x="506" y="171" width="328" height="17" fill="#0b0f14"/>
    <text x="498" y="202" text-anchor="end" fill="#484f58">4</text>
    <text x="510" y="202" fill="#e6edf3" xml:space="preserve" style="white-space:pre">  <tspan fill="#ff7b72">await</tspan> <tspan fill="#d2a8ff">test</tspan>(app);        <tspan fill="#7ee787">// ✓ 24 passed</tspan></text>
    <rect class="cv cv4" x="506" y="189" width="328" height="17" fill="#0b0f14"/>
    <text x="498" y="220" text-anchor="end" fill="#484f58">5</text>
    <text x="510" y="220" fill="#e6edf3" xml:space="preserve" style="white-space:pre">  <tspan fill="#ff7b72">return</tspan> <tspan fill="#d2a8ff">deploy</tspan>(app);     <tspan fill="#7ee787">// ▲ live</tspan></text>
    <rect class="cv cv5" x="506" y="207" width="328" height="17" fill="#0b0f14"/>
    <text x="498" y="238" text-anchor="end" fill="#484f58">6</text>
    <text x="510" y="238" fill="#e6edf3" xml:space="preserve" style="white-space:pre">}</text>
    <rect class="cv cv6" x="506" y="225" width="328" height="17" fill="#0b0f14"/>
    <g class="done"><rect class="cur" x="518" y="225" width="7" height="15" fill="#39d353"/></g>
  </g>

  <!-- who -->
  <g class="day mono" font-size="13">
    <circle cx="41" cy="50" r="4" fill="#2563eb"/>
    <text x="54" y="54.500" fill="#57606a">09:00 · day shift</text>
  </g>
  <g class="night mono" font-size="13" opacity="0">
    <circle class="pulse" cx="41" cy="50" r="4" fill="#39d353"/>
    <text x="54" y="54.500" fill="#8b949e">23:47 · night shift</text>
  </g>

  <text class="name sans" x="36" y="112" font-size="38" font-weight="800" letter-spacing="-.5" fill="#0f172a">Vitalii Zabolotnyi</text>

  <text class="day sans" x="36" y="155" font-size="25" font-weight="600" fill="#2563eb">DB by day.</text>
  <text class="night sans" x="36" y="155" font-size="25" font-weight="700" fill="#ff7b72" opacity="0" filter="url(#glow)">Vibes by night.</text>

  <rect class="chip" x="36" y="188" width="392" height="40" rx="9" fill="#fff" stroke="#d0d7de"/>
  <text class="day mono" x="52" y="213" font-size="13" fill="#3b4a5e" xml:space="preserve"><tspan fill="#2563eb" font-weight="700">SELECT</tspan> * <tspan fill="#2563eb" font-weight="700">FROM</tspan> prod <tspan fill="#2563eb" font-weight="700">WHERE</tspan> tested = 1;</text>
  <g class="night mono" font-size="13" opacity="0">
    <text x="52" y="213" fill="#e6edf3" xml:space="preserve"><tspan fill="#39d353" font-weight="700">$</tspan> vibe --ship-first --polish-later</text>
    <rect class="cur" x="328" y="200" width="8" height="17" fill="#39d353"/>
  </g>
</g>
<rect class="edge" x=".5" y=".5" width="859" height="279" rx="13.500" fill="none" stroke="#d0d7de"/>
</svg>

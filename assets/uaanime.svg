<svg xmlns="http://www.w3.org/2000/svg" width="860" height="372" viewBox="0 0 860 372" role="img" aria-labelledby="t d">
<title id="t">uaanime — home screen, Enter, and the episode resumes where you stopped</title>
<desc id="d">Illustration of the uaanime terminal app. The home screen lists a title to continue with the position where playback stopped. Pressing Enter switches to the playing screen, which resumes the episode from 14:32 with the remembered dubbing studio.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
.art{font-size:13px;font-weight:700}
.ac{fill:#D97757}.br{fill:#FBF8F3}.fg{fill:#E3DED5}.dim{fill:#9A9389}.fa{fill:#5C574F}.ok{fill:#93C79A}
.b{font-weight:700}
/* one 14 s loop: home 0-42%, Enter at 28-42%, playing 48-93% */
.home{animation:home 14s infinite}
.play{opacity:0;animation:play 14s infinite}
.key{opacity:0;animation:key 14s infinite}
.sel{animation:sel 14s infinite}
.tick{animation:tick 14s infinite step-end}
.fill{transform-box:fill-box;transform-origin:left center;animation:fill 14s infinite linear}
.head{animation:head 14s infinite linear}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes home{0%,42%{opacity:1}46%,96%{opacity:0}100%{opacity:1}}
@keyframes play{0%,44%{opacity:0}48%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes key{0%,27%{opacity:0;transform:translateY(6px)}30%,41%{opacity:1;transform:translateY(0)}45%,100%{opacity:0;transform:translateY(0)}}
@keyframes sel{0%,29%{opacity:0}31%,42%{opacity:1}46%,100%{opacity:0}}
@keyframes tick{0%,50%{transform:translateY(0)}57.140%{transform:translateY(-24px)}64.280%{transform:translateY(-48px)}71.420%{transform:translateY(-72px)}78.560%{transform:translateY(-96px)}85.700%{transform:translateY(-120px)}92.840%,100%{transform:translateY(-144px)}}
@keyframes fill{0%,48%{transform:scaleX(1)}93%,100%{transform:scaleX(1.012)}}
@keyframes head{0%,48%{transform:translateX(0)}93%,100%{transform:translateX(4.300px)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="win"><rect width="860" height="372" rx="12"/></clipPath>
  <clipPath id="clock"><rect x="28" y="196" width="60" height="24"/></clipPath>
</defs>

<g clip-path="url(#win)">
  <rect width="860" height="372" fill="#171513"/>
  <rect width="860" height="38" fill="#211E1B"/>
  <line x1="0" y1="38" x2="860" y2="38" stroke="#36312B"/>
  <circle cx="24" cy="19" r="6.500" fill="#ff5f57"/><circle cx="46" cy="19" r="6.500" fill="#febc2e"/><circle cx="68" cy="19" r="6.500" fill="#28c840"/>
  <text x="430" y="24" text-anchor="middle" class="dim" style="font-size:13px">uaanime</text>

  <!-- home screen -->
  <g class="home">
    <g class="art">
      <text x="28" y="72" xml:space="preserve" style="white-space:pre"><tspan class="ac"> _  _  __ _ </tspan><tspan class="br"> __ _  _ _  (_) _ __   ___ </tspan></text>
      <text x="28" y="88" xml:space="preserve" style="white-space:pre"><tspan class="ac">| || |/ _` |</tspan><tspan class="br">/ _` || ' \ | || '  \ / -_)</tspan></text>
      <text x="28" y="104" xml:space="preserve" style="white-space:pre"><tspan class="ac"> \_,_|\__,_|</tspan><tspan class="br">\__,_||_||_||_||_|_|_|\___|</tspan></text>
    </g>
    <text x="28" y="130" class="dim">Аніме українською · дубляж і субтитри</text>

    <text x="28" y="168" class="dim b">Продовжити</text>
    <rect class="sel" x="20" y="177" width="820" height="26" rx="5" fill="#D97757" fill-opacity=".14" opacity="0"/>
    <text x="28" y="195" class="ac b">❯</text>
    <text x="48" y="195" class="br b">Фрірен, що проводжає в останню путь · серія 14</text>
    <text x="832" y="195" text-anchor="end" class="fg">зупинився на 14:32</text>
    <text x="48" y="219" class="fg">Дандадан · серія 7</text>
    <text x="832" y="219" text-anchor="end" class="dim">зупинився на 03:10</text>

    <text x="28" y="257" class="dim b">Закладки</text>
    <text x="48" y="281" class="fg">Магічна битва</text>
    <text x="832" y="281" text-anchor="end"><tspan class="dim">переглядаєш · </tspan><tspan class="ac b">+2 нові серії</tspan></text>
    <text x="48" y="305" class="fg">Усі закладки · 12</text>

    <text x="28" y="346" class="dim" style="font-size:13px">↑↓ вибір · Enter відкрити · / пошук · ? довідка · q вихід</text>
  </g>

  <!-- the Enter keypress -->
  <g class="key">
    <rect x="744" y="325" width="88" height="30" rx="7" fill="#2A2622" stroke="#D97757"/>
    <text x="788" y="345" text-anchor="middle" class="ac b" style="font-size:13px">↵ Enter</text>
  </g>

  <!-- playing screen -->
  <g class="play">
    <text x="28" y="78" class="dim b">Грає</text>
    <text x="28" y="112" class="br b" style="font-size:18px">Фрірен, що проводжає в останню путь</text>
    <text x="28" y="140" class="fg">серія 14 · FanVoxUA · озвучення</text>
    <circle class="pulse" cx="33" cy="172" r="4" fill="#93C79A"/>
    <text x="46" y="177" class="ok">продовжено з 14:32 — там, де ти зупинився</text>

    <g clip-path="url(#clock)">
      <g class="tick br b" style="font-size:15px">
        <text x="28" y="214">14:32</text>
        <text x="28" y="238">14:33</text>
        <text x="28" y="262">14:34</text>
        <text x="28" y="286">14:35</text>
        <text x="28" y="310">14:36</text>
        <text x="28" y="334">14:37</text>
        <text x="28" y="358">14:38</text>
      </g>
    </g>
    <rect x="92" y="205" width="676" height="6" rx="3" fill="#36312B"/>
    <rect class="fill" x="92" y="205" width="407" height="6" rx="3" fill="#D97757"/>
    <circle class="head" cx="499" cy="208" r="7" fill="#FBF8F3"/>
    <text x="832" y="214" text-anchor="end" class="dim" style="font-size:15px">24:10</text>

    <text x="28" y="256" class="dim">гучність 80% · завершиться о 23:58</text>
    <text x="28" y="280" class="dim">далі · серія 15</text>

    <text x="28" y="346" class="dim" style="font-size:13px">Space пауза · ←/→ ±10 с · N наступна · . досидіти серію · Esc стоп</text>
  </g>
</g>
<rect x=".500" y=".500" width="859" height="371" rx="11.500" fill="none" stroke="#36312B"/>
</svg>
